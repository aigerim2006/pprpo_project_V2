{% load static i18n %}<!DOCTYPE html>
<html lang="ru" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% trans "Ошибка сервера" %} | {% trans "АИС ЗСТС" %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body class="d-flex align-items-center min-vh-100">
  <div class="container text-center">
    <div class="error-code">500</div>
    <h1 class="h3 mb-3">{% trans "Внутренняя ошибка сервера" %}</h1>
    <p class="text-secondary mb-4">{% trans "Произошёл непредвиденный сбой. Мы уже работаем над его устранением. Пожалуйста, повторите попытку позже." %}</p>
    <a class="btn btn-primary" href="/">{% trans "На главную" %}</a>
  </div>
</body>
</html>
